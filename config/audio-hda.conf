# HP Chromebook x360 11 G1 EE (Snappy) Audio Configuration
#
# This forces the Intel DSP config to use SOF (Sound Open Firmware) driver
# instead of the legacy HDA driver or SST driver.
#
# dsp_driver values:
#   0 = auto (default)
#   1 = legacy HDA (no DSP, HDMI only)
#   2 = SST (older DSP driver)
#   3 = SOF (Sound Open Firmware - required for this hardware)
#   4 = AVS (Audio Virtual Sound)
#
options snd_intel_dspcfg dsp_driver=3
